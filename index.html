<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionale Agriturismo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Modal Login Staff -->
  <div id="login-modal" class="modal">
    <div class="modal-content">
      <h2>Accesso Dipendenti</h2>
      <input type="password" id="staff-pass-input" placeholder="Password staff">
      <button onclick="loginStaff()">Accedi</button>
      <p id="login-error" class="error-msg"></p>
    </div>
  </div>

  <!-- Contenuto Principale -->
  <div id="app-container" class="hidden">
    <header class="no-print">
      <h1>Gestione Agriturismo</h1>
      <button class="btn-master" onclick="openMasterModal()">Area Riservata Master</button>
    </header>

    <main class="no-print">
      <div id="rooms-grid" class="grid-container"></div>
    </main>

    <!-- Area Riservata Master (Contabilità & Listini) -->
    <div id="master-report-section" class="hidden">
      <div class="report-header">
        <h2>Registro Prenotazioni, Acconti e Saldi</h2>
        <button class="btn-primary no-print" onclick="window.print()">Stampa Report</button>
        <button class="btn-secondary no-print" onclick="closeMasterReport()">Chiudi Master</button>
      </div>

      <!-- Configurazione Prezzi Stagionali a Persona -->
      <div class="card no-print" style="margin: 20px 0;">
        <h3>Imposta Tariffa a Persona per Periodo</h3>
        <div class="form-row">
          <input type="date" id="season-start">
          <input type="date" id="season-end">
          <input type="number" id="season-pp-price" placeholder="€ / Persona a Notte">
          <button onclick="saveSeasonPrice()">Salva Periodo</button>
        </div>
      </div>

      <!-- Tabella Contabilità -->
      <table class="report-table">
        <thead>
          <tr>
            <th>Camera</th>
            <th>Ospite</th>
            <th>Persone</th>
            <th>Notti</th>
            <th>€/Pers/Notte</th>
            <th>Totale</th>
            <th>Acconto</th>
            <th>Saldo</th>
            <th class="no-print">Azioni</th>
          </tr>
        </thead>
        <tbody id="master-table-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal Prenotazione -->
  <div id="booking-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-room-title">Prenota Camera</h3>
      <input type="hidden" id="book-room-id">
      <input type="text" id="book-guest-name" placeholder="Nome Referente">
      <input type="number" id="book-guests-count" placeholder="Numero Persone" min="1">
      <label>Check-in:</label>
      <input type="date" id="book-checkin">
      <label>Check-out:</label>
      <input type="date" id="book-checkout">
      <input type="number" id="book-deposit" placeholder="Acconto versato (€)" value="0">
      <button onclick="saveBooking()">Conferma Prenotazione</button>
      <button class="btn-secondary" onclick="closeBookingModal()">Annulla</button>
    </div>
  </div>

  <!-- Modal PIN Direzione -->
  <div id="master-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Area Direzione</h2>
      <input type="password" id="master-pin-input" placeholder="PIN Direzione">
      <button onclick="loginMaster()">Accedi al Registro</button>
      <button class="btn-secondary" onclick="closeMasterModal()">Annulla</button>
      <p id="master-error" class="error-msg"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
